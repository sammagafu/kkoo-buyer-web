name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build-only

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build-only
      - run: npm run test:e2e

  # Production: host nginx TLS → 127.0.0.1:5175 → Docker kkoo-buyer (nginx:alpine + baked dist).
  # Compose file lives in the API repo; buyer source is a sibling clone.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: SSH pull and rebuild buyer container
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          # Docker image builds can take several minutes.
          command_timeout: 30m
          script: |
            set -euo pipefail

            BUYER_DIR='${{ secrets.DO_BUYER_DIR }}'
            COMPOSE_DIR='${{ secrets.DO_COMPOSE_DIR }}'
            : "${BUYER_DIR:=/home/sammy/kkoo-buyer}"
            : "${COMPOSE_DIR:=/home/sammy/kkooapp-backend-fiber}"

            echo "Buyer source:  $BUYER_DIR"
            echo "Compose root:  $COMPOSE_DIR"

            cd "$BUYER_DIR"
            git fetch origin
            git checkout main
            git pull --ff-only origin main
            echo "Deploying $(git rev-parse --short HEAD)"

            cd "$COMPOSE_DIR"
            export BUYER_WEB_DIR="$BUYER_DIR"
            docker compose -f docker-compose.prod.yml up -d --build web-buyer

            echo "Waiting for buyer on :5175…"
            for i in $(seq 1 45); do
              if curl -fsS -o /dev/null http://127.0.0.1:5175/health \
                || curl -fsS -o /dev/null http://127.0.0.1:5175/; then
                echo "Buyer is up (attempt $i)"
                docker compose -f docker-compose.prod.yml ps web-buyer
                exit 0
              fi
              sleep 2
            done
            echo "Buyer did not become healthy in time"
            docker compose -f docker-compose.prod.yml logs --tail 80 web-buyer || true
            exit 1
